# 対象ビルドがTestFlightでインストール可能（処理=VALID）になるまで待つ（通知用）。手動実行。
# App Store Connect API で対象ビルドの processingState と輸出コンプライアンスを確認し、
# VALID になったら成功終了する（＝実際にTestFlightで入手可能）。
name: wait-ready

on:
  workflow_dispatch:
    inputs:
      target:
        description: "待つ対象のビルド番号"
        required: true
        default: "26"

jobs:
  wait:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      TARGET_BUILD: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: インストール可能になるまで待つ
        run: bundle exec fastlane wait_ready
