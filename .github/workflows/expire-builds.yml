# 指定範囲のTestFlightビルドをExpire（TestFlightから消す）。手動実行。
name: expire-builds

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Expire開始ビルド番号"
        required: true
        default: "26"
      to:
        description: "Expire終了ビルド番号"
        required: true
        default: "39"

jobs:
  expire:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      EXPIRE_FROM: ${{ inputs.from }}
      EXPIRE_TO: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: 指定範囲のビルドをExpire
        run: bundle exec fastlane expire_builds
