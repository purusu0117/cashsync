# TestFlight配布（署名あり）。Actions の「Run workflow」から手動実行する。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID / APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD /
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY
# Secrets が未設定のうちは fastlane-syntax ジョブだけが動く（Fastfile の構文チェック）。
name: testflight

on:
  workflow_dispatch:
  push:
    branches: [cloud]
    paths:
      - "fastlane/**"
      - "Gemfile"
      - ".github/workflows/testflight.yml"

jobs:
  # Secrets 不要。Fastfile が壊れていないか（読み込めるか）だけ確認する
  fastlane-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fastfile を読み込めるか確認
        run: bundle exec fastlane lanes

  upload:
    # 手動実行のときだけ走る（pushでは走らせない＝ビルド番号を無駄に消費しない）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 必要な Secrets が揃っているか確認
        run: |
          missing=""
          for k in APPLE_TEAM_ID APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!k}" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::次のSecretsが未設定です:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      # capacitor.config.ts → ネイティブ設定へ反映＋Package.swift 再生成
      - name: Capacitor sync
        run: npx cap sync ios

      - name: TestFlight へアップロード
        run: bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cashsync-ipa
          path: build/*.ipa
          if-no-files-found: warn
